name: Docker image

# Builds the web edition's Docker image (the root Dockerfile, see
# apps/web/README.md) and publishes it to GitHub's container registry as
# ghcr.io/<owner>/<repo>, lower-cased (ghcr.io/jigglyy/kanbini here).
#
#  - A version tag (the same `v*` tag that cuts a release) publishes
#    `X.Y.Z`, `X.Y` and `latest`.
#  - A manual run (Actions tab, or `gh workflow run docker.yml --ref
#    <branch>`) publishes the branch name as the tag (e.g. `main`), never
#    `latest`.
#  - A pull request that touches the image, or the desktop sources it is
#    built from, only builds it, without logging in or pushing, so a broken
#    image build shows up before merge. (Direct pushes to main are covered
#    by apps/web/repo-guards.test.ts, which runs in `pnpm verify`.)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - 'apps/web/**'
      - 'apps/desktop/src/main/**'
      - 'apps/renderer/src/**'
      - 'apps/mcp/**'
      - 'packages/**'
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/docker.yml

permissions:
  contents: read
  # Lets the built-in GITHUB_TOKEN push to ghcr.io.
  packages: write

jobs:
  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Buildx is needed for the GitHub Actions build cache below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Image name and tags. metadata-action lower-cases the name, so it
      # works unchanged in forks. `latest` comes with the semver tags.
      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # shortcut: amd64 only (QEMU arm64 builds are slow and untested here), add linux/arm64 when someone needs to run it on ARM.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
